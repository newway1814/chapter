                        }

                    animation: {
                        breathe: 'breathe 3s ease-in-out infinite',

                        fadeInUp3: 'fadeInUp 0.6s ease-out 0.6s forwards',

<style>
        body {
            background-color: #FAF7F2;
        }
        .waveform-bar {
            width: 3px;
            background-color: #993C1D;
            border-radius: 9999px;
            margin: 0 2px;
            display: inline-block;
        }
        .waveform-bar:nth-child(odd) { animation-duration: 0.8s; }
        .waveform-bar:nth-child(even) { animation-duration: 1.2s; }
        .waveform-bar:nth-child(3n) { animation-duration: 0.9s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="text-on-background flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 sticky border-b border-outline-variant dark:border-outline flex justify-between items-center px-container-margin py-md max-w-7xl mx-auto z-40 bg-[#FAF7F2]">

<h1 class="font-label-caps text-label-caps tracking-[0.12em] text-primary dark:text-primary-fixed-dim uppercase text-center flex-grow">CHAPTER</h1>
<div class="w-6 h-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-xxl pb-32">
<!-- Date Header -->
<div class="text-center mb-16 opacity-0 animate-[fadeInUp_0.6s_ease-out_0.2s_forwards]">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.15em]">Saturday, June 20</p>
</div>
<!-- Centerpiece Recording Button -->
<div class="relative flex flex-col items-center justify-center w-full mb-12 opacity-0 animate-[fadeInUp_0.6s_ease-out_0.4s_forwards]">
<!-- Outer Ripple Effect (Optional, simulated with stacked divs or box shadow if desired, but keeping to 2D flat depth) -->
<button class="w-40 h-40 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center animate-breathe hover:bg-primary transition-colors duration-300 shadow-none border border-transparent">
<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Visual Feedback Waveform -->
<div class="h-16 flex items-center justify-center opacity-0 animate-[fadeInUp_0.6s_ease-out_0.6s_forwards] mb-12 w-full max-w-xs">
<!-- Simulated vector path waveform with CSS bars -->
<div class="flex items-end h-12 justify-center w-full space-x-1"><svg viewBox="0 0 200 40" class="w-full h-full overflow-visible"><path d="M0 20 Q 25 0, 50 20 T 100 20 T 150 20 T 200 20" fill="none" stroke="#993C1D" stroke-width="1.5" class="animate-waveform"></path></svg></div>
</div>
<!-- Footer Text -->
<div class="text-center px-lg opacity-0 animate-[fadeInUp_0.6s_ease-out_0.8s_forwards] max-w-sm">
<p class="font-body-md text-body-md text-on-surface-variant italic">Speak your mind. We will transcribe your chapter.</p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-lg pb-lg pt-sm border-t border-outline-variant dark:border-outline bg-[#FAF7F2]"><!-- RECORD --><a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim pt-2 w-1/3 hover:opacity-70 transition-opacity" href="#"><span class="material-symbols-outlined mb-1 !font-light" style="font-variation-settings: 'FILL' 0, 'wght' 200;">mic</span><span class="font-label-caps text-[10px] tracking-widest uppercase">RECORD</span></a><!-- CALENDAR --><a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant pt-2 w-1/3 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors" href="#"><span class="material-symbols-outlined mb-1 !font-light" style="font-variation-settings: 'FILL' 0, 'wght' 200;">calendar_month</span><span class="font-label-caps text-[10px] tracking-widest uppercase">CALENDAR</span></a><!-- STORIES --><a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant pt-2 w-1/3 hover:text-primary dark:hover:text-primary-fixed-dim transition-colors" href="#"><span class="material-symbols-outlined mb-1 !font-light" style="font-variation-settings: 'FILL' 0, 'wght' 200;">auto_stories</span><span class="font-label-caps text-[10px] tracking-widest uppercase">STORIES</span></a></nav>
